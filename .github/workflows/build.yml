name: Build and test C++
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure MSVC x64
        shell: pwsh
        run: cmake -S . -B build/msvc -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DFIXER_REQUIRE_NETWORK_TESTS=ON '-DFIXER_APP_UPDATE_PUBLIC_KEY:FILEPATH=keys/app-update-public.der'
      - name: Build
        run: cmake --build build/msvc --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build/msvc -C Release --output-on-failure
      - name: Native NTFS disk-full failures
        timeout-minutes: 5
        shell: pwsh
        run: ./tools/test_windows_space.ps1 -TestExecutable ./build/msvc/Release/fixer_tests.exe
      - name: Package
        run: cmake --install build/msvc --config Release --prefix build/package
      - name: Build unsigned app-update candidate
        shell: pwsh
        run: |
          $releaseVersion = & ./build/msvc/Release/helium_drm_fixer.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path build/releases | Out-Null
          python tools/package_app_release.py --staging build/package --version $releaseVersion --platform windows-x64 --output build/releases
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-standalone-exe
          path: build/package/bin/helium_drm_fixer.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: build/package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-unsigned-update-candidate
          path: build/releases
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev libssl-dev clang libclang-rt-18-dev python3 openssl
      - name: Configure GCC
        if: matrix.compiler == 'gcc'
        run: cmake --preset debug -DFIXER_REQUIRE_NETWORK_TESTS=ON -DFIXER_APP_UPDATE_PUBLIC_KEY=keys/app-update-public.der
      - name: Configure Clang
        if: matrix.compiler == 'clang'
        run: cmake --preset debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DFIXER_SANITIZERS=ON -DFIXER_FUZZING=ON -DFIXER_REQUIRE_NETWORK_TESTS=ON -DFIXER_APP_UPDATE_PUBLIC_KEY=keys/app-update-public.der
      - name: Build
        run: cmake --build --preset debug --parallel 4
      - name: Test
        run: ctest --preset debug
      - name: Unprivileged write-permission failure
        run: build/debug/fixer_tests --permission-denied
      - name: Real disk-full transaction failures
        run: |
          space_root=$(mktemp -d)
          trap 'sudo umount "$space_root"; rmdir "$space_root"' EXIT
          sudo mount -t tmpfs -o size=8m,mode=1777 tmpfs "$space_root"
          build/debug/fixer_tests --transaction-space "$space_root"
      - name: Fuzz smoke test
        if: matrix.compiler == 'clang'
        run: |
          python3 tools/seed_fuzz.py build/corpus
          build/debug/fixer_fuzz build/corpus -max_total_time=60 -timeout=5 -rss_limit_mb=512 -max_len=65536
      - name: Build and test Release package
        if: matrix.compiler == 'gcc'
        run: |
          cmake --preset release -DFIXER_REQUIRE_NETWORK_TESTS=ON -DFIXER_APP_UPDATE_PUBLIC_KEY=keys/app-update-public.der
          cmake --build --preset release --parallel 4
          ctest --test-dir build/release --output-on-failure
          cmake --install build/release --prefix build/package
          mkdir -p build/releases
          app_version=$(build/release/helium_drm_fixer --version)
          python3 tools/package_app_release.py --staging build/package --version "$app_version" --platform linux-x86_64-ubuntu24.04 --output build/releases
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.compiler == 'gcc'
        with:
          name: linux-x86_64-ubuntu24.04
          path: build/package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.compiler == 'gcc'
        with:
          name: linux-x86_64-unsigned-update-candidate
          path: build/releases
