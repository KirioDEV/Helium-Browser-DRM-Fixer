name: Sign app release
run-name: Sign candidates from build ${{ inputs.build_run_id }}
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main push run ID from Build and test C++ (same commit)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-signing
  cancel-in-progress: false
jobs:
  sign:
    if: github.repository == 'KirioDEV/Helium-Browser-DRM-Fixer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate successful build and download exact candidates
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python3 tools/ci_release_signing.py download
      - name: Sign both candidates with the pinned release key
        env:
          RELEASE_SIGNING_KEY_PEM: ${{ secrets.RELEASE_SIGNING_KEY_PEM }}
          RELEASE_SIGNING_KEY_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_KEY_PASSPHRASE }}
        run: python3 tools/ci_release_signing.py sign
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-app-release
          path: build/signed-release/*/*
          if-no-files-found: error
          retention-days: 14
      - name: Release handoff
        run: |
          echo '### Signed Windows and Linux candidates' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download signed-app-release. Extract the outer artifact ZIP, verify each app ZIP natively, then manually upload all six ZIP/manifest/signature files to the matching stable release. No release was published.' >> "$GITHUB_STEP_SUMMARY"
