name: Sign app release
run-name: Sign candidates from build ${{ inputs.build_run_id || github.event.workflow_run.id }}
on:
  workflow_run:
    workflows: [Build and test C++]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main push run ID from Build and test C++ (same commit)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-signing
  cancel-in-progress: false
jobs:
  sign:
    if: >-
      github.repository == 'KirioDEV/Helium-Browser-DRM-Fixer' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Validate successful build and download exact candidates
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
          BUILD_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 tools/ci_release_signing.py download
      - name: Sign both candidates with the pinned release key
        env:
          RELEASE_SIGNING_KEY_PEM: ${{ secrets.RELEASE_SIGNING_KEY_PEM }}
          RELEASE_SIGNING_KEY_PASSPHRASE: ${{ secrets.RELEASE_SIGNING_KEY_PASSPHRASE }}
        run: python3 tools/ci_release_signing.py sign
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-app-release
          path: |
            build/signed-release/*/*
            build/signed-release/release-notes.md
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-standalone-exe
          path: build/signed-release/windows-x64/helium_drm_fixer.exe
          if-no-files-found: error
          retention-days: 14
      - name: Release handoff
        run: |
          echo '### Signed Windows and Linux candidates' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download signed-app-release. Extract the outer artifact ZIP, verify each app ZIP natively, then manually upload all six ZIP/manifest/signature files and helium_drm_fixer.exe to the matching stable release. Copy release-notes.md into the release description to show the Windows download first. The EXE is byte-identical to the Windows ZIP payload and needs no adjacent runtime DLLs. No release was published.' >> "$GITHUB_STEP_SUMMARY"
